<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Messages - Event Next Door</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="dashboard.html">Dashboard</a> •
      <a href="event_list.html">Explore</a> •
      <a href="saved.html">Saved</a>
    </nav>
  </header>

  <main style="max-width:960px;margin:24px auto;padding:16px;">
    <h1>Messages</h1>

    <section style="margin-bottom:20px;">
      <h2>Send a message</h2>
      <div id="formError" class="alert error" style="display:none;color:#ff6b6b"></div>
      <div id="formSuccess" class="alert success" style="display:none;color:#4ade80"></div>
      <form id="sendMessageForm">
        <div class="form-group">
          <label for="toUserId">To (user id)</label>
          <input id="toUserId" placeholder="recipient user id" />
        </div>
        <div class="form-group">
          <label for="messageContent">Message</label>
          <textarea id="messageContent" rows="4" placeholder="Write your message..."></textarea>
        </div>
        <button type="submit">Send</button>
      </form>
    </section>

    <section>
      <h2>Inbox</h2>
      <div id="messagesContainer">Loading messages...</div>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script>
    // Default to same origin if not set by deploy
    window.API_BASE_URL = window.API_BASE_URL || window.location.origin;
  </script>
  <script src="js/messages.js"></script>
</body>
</html>
